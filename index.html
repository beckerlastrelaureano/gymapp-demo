<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Manifest: en el link de un gimnasio (?g=...) se arma antes de que el celular lo lea,
         así la app instalada abre siempre en ese gimnasio. En la demo, manifest.json. -->
    <script>
      (function () {
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = 'manifest.json';
        try {
          var q = new URLSearchParams(location.search).get('g'), c = null, d = null;
          try { c = JSON.parse(localStorage.getItem('gymapp-nube')); } catch (e) {}
          var g = q || (c && c.gid);
          if (g) {
            try { d = JSON.parse(localStorage.getItem('gymapp-datos-v1')); } catch (e) {}
            var mismo = !q || (c && c.gid === q);
            var n = mismo && d && d.gym && d.gym.nombre && d.gym.nombre !== 'Gimnasio Demo' ? d.gym.nombre : 'Mi gimnasio';
            var dir = location.origin + location.pathname.replace(/[^/]*$/, '');
            var inicio = dir + '?g=' + encodeURIComponent(g);
            l.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify({
              id: inicio, name: n, short_name: n.length > 14 ? n.split(/\s+/)[0].slice(0, 14) : n,
              lang: 'es-AR', start_url: inicio, scope: dir, display: 'standalone',
              background_color: '#0A0C0E', theme_color: '#0A0C0E',
              icons: [{ src: dir + 'icon-192.png', sizes: '192x192', type: 'image/png' }, { src: dir + 'icon-512.png', sizes: '512x512', type: 'image/png' }]
            }));
            var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (t) t.setAttribute('content', n.length > 14 ? n.split(/\s+/)[0].slice(0, 14) : n);
          }
        } catch (e) {}
        document.head.appendChild(l);
      })();
    </script>
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
